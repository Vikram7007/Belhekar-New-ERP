  <!-- Text: GROUP OF INSTITUTES -->
  <text x="150" y="308" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="14" fill="#c5a059" text-anchor="middle" letter-spacing="4">GROUP OF INSTITUTES</text>
