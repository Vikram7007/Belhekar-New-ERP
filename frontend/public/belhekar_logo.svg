    <path d="M 182,65 C 202,62 212,72 218,85 C 212,85 198,80 185,75 Z" />
    <path d="M 198,95 C 218,95 228,110 232,125 C 225,125 210,115 198,108 Z" />
    <path d="M 202,135 C 222,140 230,160 232,175 C 225,170 210,155 200,148 Z" />
    <path d="M 196,175 C 212,185 218,205 215,220 C 208,212 196,198 188,188 Z" />
