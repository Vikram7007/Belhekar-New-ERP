  <path d="M 122,82 L 152,82 C 168,82 178,90 178,104 C 178,115 170,122 158,124 C 172,127 182,135 182,150 C 182,166 168,175 148,175 L 122,175 Z M 138,96 L 138,118 L 150,118 C 158,118 164,113 164,107 C 164,100 158,96 150,96 Z M 138,132 L 138,161 L 150,161 C 160,161 166,155 166,146 C 166,138 160,132 150,132 Z" fill="url(#navyGrad)" />

