<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Brown / Orange Rings -->
  <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="#c2410c" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="#fff7ed" stroke="#78350f" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="100" cy="100" r="68" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>

  <!-- Circular Text Top: DNYANESHWAR POLYTECHNIC -->
  <path id="textPathTop" d="M 28,100 A 72,72 0 1,1 172,100" fill="none"/>
  <text font-size="13" font-weight="900" fill="#9a3412" letter-spacing="2.2" text-anchor="middle" font-family="Arial, sans-serif">
    <textPath href="#textPathTop" startOffset="50%">DNYANESHWAR POLYTECHNIC</textPath>
  </text>

  <!-- Circular Text Bottom: BHANASHIVRE -->
  <path id="textPathBottom" d="M 172,100 A 72,72 0 0,1 28,100" fill="none"/>
  <text font-size="12" font-weight="800" fill="#9a3412" letter-spacing="3" text-anchor="middle" font-family="Arial, sans-serif">
    <textPath href="#textPathBottom" startOffset="50%">★ BHANASHIVRE ★</textPath>
  </text>

  <!-- Center Artwork: Sant Dnyaneshwar / Diya / Sacred Book -->
  <g transform="translate(100, 98) scale(0.68)">
    <!-- Halo -->
    <circle cx="0" cy="-20" r="28" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <!-- Head / Silhouette of Sant Dnyaneshwar -->
    <circle cx="0" cy="-24" r="14" fill="#ea580c"/>
    <!-- Pheta / Turban -->
    <ellipse cx="0" cy="-32" rx="16" ry="8" fill="#c2410c"/>
    <circle cx="0" cy="-36" r="3" fill="#fbbf24"/>
    <!-- Body in Orange / Saffron Robe -->
    <path d="M -22,12 C -20,-10 20,-10 22,12 C 16,18 -16,18 -22,12 Z" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
    <path d="M -12,-8 L 0,12 L 12,-8" fill="none" stroke="#fed7aa" stroke-width="2"/>
    <!-- Dnyaneshwari Holy Book / Grantha -->
    <path d="M -30,22 L 0,14 L 30,22 L 30,30 L 0,22 L -30,30 Z" fill="#78350f"/>
    <path d="M -28,20 L 0,13 L 28,20 L 28,24 L 0,17 L -28,24 Z" fill="#fef3c7"/>
    <!-- Diya / Flame at bottom -->
    <path d="M -14,35 Q 0,42 14,35 Q 0,48 -14,35 Z" fill="#d97706"/>
    <path d="M 0,35 Q 3,27 0,22 Q -3,27 0,35 Z" fill="#ef4444"/>
    <circle cx="0" cy="28" r="2.5" fill="#fef08a"/>
  </g>
</svg>
